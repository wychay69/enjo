<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop · ENJO</title>
  <meta name="description" content="Browse the full ENJO range by room — kitchen, bathroom, floors, windows, living, outdoor, pet and skin care.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header data-enjo-header></header>

  <div class="wrap">
    <div class="shop-head">
      <h1 id="shop-heading">All products</h1>
      <p id="shop-tagline">Everything you need to clean your whole home with cold water.</p>
    </div>

    <div class="shop-toolbar">
      <div class="shop-search" id="shop-search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3" stroke-linecap="round"/></svg>
        <input id="shop-search" type="search" placeholder="Search fibres, tools, helpers…" aria-label="Search products">
      </div>
      <span class="shop-count" id="shop-count"></span>
    </div>

    <div class="chips" id="shop-filters"></div>
    <div class="product-grid" id="shop-grid"></div>
    <div style="height:70px"></div>
  </div>

  <footer data-enjo-footer></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/thumb.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
